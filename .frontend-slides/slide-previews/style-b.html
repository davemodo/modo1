<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style B Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
    --near-black: #1C1C1C;
    --near-black-alt: #242422;
    --acid-yellow: #F5D200;
    --acid-yellow-alt: #F0CC00;
    --border-dark: #2E2E2C;
    --font-display: 'Barlow', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }

/* === VIEWPORT BASE (mandatory fixed-stage CSS) === */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; background: var(--slide-bg, #fff); }
.slide { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; display: block; visibility: hidden; opacity: 0; pointer-events: none; background: var(--slide-bg, #fff); }
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
.deck-controls { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 1000; }
@media print {
    html, body { width: 1920px; height: auto; overflow: visible; background: #fff; }
    .deck-viewport { position: static; overflow: visible; background: #fff; }
    .deck-stage { position: static; width: auto; height: auto; transform: none !important; background: none; }
    .slide { position: relative; display: block !important; visibility: visible !important; opacity: 1 !important; pointer-events: auto !important; width: 1920px; height: 1080px; break-after: page; page-break-after: always; }
    .slide:last-child { break-after: auto; page-break-after: auto; }
    .deck-controls { display: none !important; }
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}
/* === END VIEWPORT BASE === */

.reveal {
    opacity: 0;
    transform: translateY(36px);
    transition: opacity 0.7s var(--ease-out-expo), transform 0.7s var(--ease-out-expo);
}
.slide.visible .reveal { opacity: 1; transform: translateY(0); }
.reveal:nth-child(1) { transition-delay: 0.1s; }
.reveal:nth-child(2) { transition-delay: 0.3s; }

/* === STYLE B: STUDIO === */
.title-slide {
    background: var(--near-black);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 120px;
    position: relative;
}
.headline {
    font-family: var(--font-display);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.02em;
    line-height: 0.98;
    color: var(--acid-yellow);
    font-size: 168px;
}
.headline .line2 { color: var(--near-black); background: var(--acid-yellow); display: inline-block; padding: 0 16px; }
.subtitle {
    margin-top: 56px;
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 30px;
    color: var(--acid-yellow-alt);
    max-width: 1100px;
    line-height: 1.4;
}
.footer-bar {
    position: absolute;
    left: 120px;
    right: 120px;
    bottom: 64px;
    display: flex;
    justify-content: space-between;
    border-top: 1px solid var(--border-dark);
    padding-top: 24px;
    font-family: var(--font-mono);
    font-size: 18px;
    color: var(--acid-yellow-alt);
    letter-spacing: 0.04em;
}
</style>
</head>
<body>
<div class="deck-viewport">
<main class="deck-stage" id="deckStage">
<section class="slide active visible title-slide">
    <h1 class="headline reveal">AI IS REWRITING<br><span class="line2">REAL ESTATE MARKETING</span></h1>
    <p class="subtitle reveal">A 2026 field guide for agents, brokerages, and marketing teams navigating the shift.</p>
    <div class="footer-bar reveal">
        <span>2026 OUTLOOK</span>
        <span>REAL ESTATE × AI</span>
        <span>01 / 14</span>
    </div>
</section>
</main>
</div>
<script>
function setupStageScale() {
    const stage = document.getElementById('deckStage');
    const scale = () => {
        const factor = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        const x = (window.innerWidth - 1920 * factor) / 2;
        const y = (window.innerHeight - 1080 * factor) / 2;
        stage.style.transform = `translate(${x}px, ${y}px) scale(${factor})`;
    };
    scale();
    window.addEventListener('resize', scale);
}
setupStageScale();
</script>
</body>
</html>
