<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style A Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --bg-dark: #0a0a0a;
    --bg-white: #ffffff;
    --accent-blue: #4361ee;
    --text-dark: #0a0a0a;
    --text-light: #ffffff;
    --font-display: 'Manrope', sans-serif;
    --font-body: 'Manrope', sans-serif;
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }

/* === VIEWPORT BASE (mandatory fixed-stage CSS) === */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; background: var(--slide-bg, #fff); }
.slide { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; display: block; visibility: hidden; opacity: 0; pointer-events: none; background: var(--slide-bg, #fff); }
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
.deck-controls { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 1000; }
@media print {
    html, body { width: 1920px; height: auto; overflow: visible; background: #fff; }
    .deck-viewport { position: static; overflow: visible; background: #fff; }
    .deck-stage { position: static; width: auto; height: auto; transform: none !important; background: none; }
    .slide { position: relative; display: block !important; visibility: visible !important; opacity: 1 !important; pointer-events: auto !important; width: 1920px; height: 1080px; break-after: page; page-break-after: always; }
    .slide:last-child { break-after: auto; page-break-after: auto; }
    .deck-controls { display: none !important; }
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}
/* === END VIEWPORT BASE === */

.reveal {
    opacity: 0;
    transform: translateY(28px);
    transition: opacity 0.7s var(--ease-out-expo), transform 0.7s var(--ease-out-expo);
}
.slide.visible .reveal { opacity: 1; transform: translateY(0); }
.reveal:nth-child(1) { transition-delay: 0.1s; }
.reveal:nth-child(2) { transition-delay: 0.25s; }
.reveal:nth-child(3) { transition-delay: 0.4s; }

/* === STYLE A: ELECTRIC STUDIO === */
.title-slide {
    display: flex;
    flex-direction: column;
}
.panel-top {
    flex: 0 0 62%;
    background: var(--bg-white);
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 140px;
}
.panel-top::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 10px;
    background: var(--accent-blue);
}
.eyebrow {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent-blue);
    margin-bottom: 28px;
}
.headline {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 96px;
    line-height: 1.05;
    color: var(--text-dark);
    letter-spacing: -0.02em;
    max-width: 1400px;
}
.panel-bottom {
    flex: 1;
    background: var(--accent-blue);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 140px;
}
.subtitle {
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 32px;
    line-height: 1.4;
    color: var(--text-light);
    max-width: 900px;
}
.meta-corner {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 20px;
    color: rgba(255,255,255,0.75);
    text-align: right;
    letter-spacing: 0.04em;
}
.meta-corner span { display: block; }
.brand-mark {
    position: absolute;
    top: 48px;
    right: 140px;
    font-family: var(--font-body);
    font-weight: 800;
    font-size: 22px;
    color: var(--text-dark);
    letter-spacing: 0.02em;
}
.brand-mark::before {
    content: '';
    display: inline-block;
    width: 12px; height: 12px;
    background: var(--accent-blue);
    margin-right: 10px;
    border-radius: 50%;
    vertical-align: middle;
}
</style>
</head>
<body>
<div class="deck-viewport">
<main class="deck-stage" id="deckStage">
<section class="slide active visible title-slide">
    <div class="panel-top">
        <div class="brand-mark">Real Estate × AI</div>
        <div class="eyebrow reveal">2026 Marketing Outlook</div>
        <h1 class="headline reveal">How AI Will Shape Real Estate Marketing in 2026</h1>
    </div>
    <div class="panel-bottom">
        <p class="subtitle reveal">A practical field guide to the tools, tactics, and shifts every agent and brokerage needs to understand.</p>
        <div class="meta-corner reveal"><span>Chapter 01</span><span>Introduction</span></div>
    </div>
</section>
</main>
</div>
<script>
function setupStageScale() {
    const stage = document.getElementById('deckStage');
    const scale = () => {
        const factor = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        const x = (window.innerWidth - 1920 * factor) / 2;
        const y = (window.innerHeight - 1080 * factor) / 2;
        stage.style.transform = `translate(${x}px, ${y}px) scale(${factor})`;
    };
    scale();
    window.addEventListener('resize', scale);
}
setupStageScale();
</script>
</body>
</html>
