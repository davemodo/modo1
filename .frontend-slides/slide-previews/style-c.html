<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style C Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
    --bg-blueprint: #0a1930;
    --grid-line: rgba(94, 200, 216, 0.14);
    --cyan: #5ec8d8;
    --amber: #ffb703;
    --ink: #eef2f6;
    --ink-dim: #9fb2c4;
    --font-display: 'Bricolage Grotesque', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
    --font-body: 'Public Sans', sans-serif;
    --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }

/* === VIEWPORT BASE (mandatory fixed-stage CSS) === */
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-viewport { position: fixed; inset: 0; overflow: hidden; background: var(--stage-bg, #000); }
.deck-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; background: var(--slide-bg, #fff); }
.slide { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; display: block; visibility: hidden; opacity: 0; pointer-events: none; background: var(--slide-bg, #fff); }
.slide.active, .slide.visible { visibility: visible; opacity: 1; pointer-events: auto; z-index: 1; }
img, video, canvas, svg { max-width: 100%; max-height: 100%; }
.deck-controls { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 1000; }
@media print {
    html, body { width: 1920px; height: auto; overflow: visible; background: #fff; }
    .deck-viewport { position: static; overflow: visible; background: #fff; }
    .deck-stage { position: static; width: auto; height: auto; transform: none !important; background: none; }
    .slide { position: relative; display: block !important; visibility: visible !important; opacity: 1 !important; pointer-events: auto !important; width: 1920px; height: 1080px; break-after: page; page-break-after: always; }
    .slide:last-child { break-after: auto; page-break-after: auto; }
    .deck-controls { display: none !important; }
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
}
/* === END VIEWPORT BASE === */

.reveal {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.8s var(--ease-out-expo), transform 0.8s var(--ease-out-expo);
}
.slide.visible .reveal { opacity: 1; transform: translateY(0); }
.reveal:nth-child(1) { transition-delay: 0.1s; }
.reveal:nth-child(2) { transition-delay: 0.3s; }
.reveal:nth-child(3) { transition-delay: 0.5s; }
.reveal:nth-child(4) { transition-delay: 0.7s; }

/* === STYLE C: BLUEPRINT INTELLIGENCE (custom) === */
.title-slide {
    background:
        linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0 / 80px 80px,
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0 / 80px 80px,
        var(--bg-blueprint);
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 160px;
}
/* Drafting corner crop marks */
.crop { position: absolute; width: 44px; height: 44px; }
.crop::before, .crop::after { content: ''; position: absolute; background: var(--cyan); opacity: 0.55; }
.crop::before { width: 44px; height: 1px; }
.crop::after { width: 1px; height: 44px; }
.crop.tl { top: 56px; left: 56px; }
.crop.tr { top: 56px; right: 56px; }
.crop.bl { bottom: 56px; left: 56px; }
.crop.br { bottom: 56px; right: 56px; }

.network-bg { position: absolute; top: 0; right: 0; width: 900px; height: 1080px; opacity: 0.5; }

.eyebrow {
    font-family: var(--font-mono);
    font-size: 20px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--cyan);
    margin-bottom: 32px;
}
.eyebrow::before { content: '// '; color: var(--amber); }

.headline {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 88px;
    line-height: 1.08;
    color: var(--ink);
    letter-spacing: -0.01em;
    max-width: 1300px;
}
.headline em {
    font-style: normal;
    color: var(--amber);
}

.dimension-line {
    margin-top: 36px;
    display: flex;
    align-items: center;
    gap: 16px;
    max-width: 900px;
}
.dimension-line .tick { width: 1px; height: 14px; background: var(--cyan); opacity: 0.6; }
.dimension-line .bar { flex: 1; height: 1px; background: var(--cyan); opacity: 0.6; }
.dimension-line .label {
    font-family: var(--font-mono);
    font-size: 16px;
    color: var(--ink-dim);
    letter-spacing: 0.06em;
    white-space: nowrap;
}

.subtitle {
    margin-top: 40px;
    font-family: var(--font-body);
    font-weight: 400;
    font-size: 28px;
    line-height: 1.5;
    color: var(--ink-dim);
    max-width: 980px;
}

.figtag {
    position: absolute;
    top: 96px;
    right: 160px;
    font-family: var(--font-mono);
    font-size: 16px;
    color: var(--ink-dim);
    text-align: right;
    letter-spacing: 0.05em;
}
.figtag .num {
    display: inline-block;
    width: 28px; height: 28px;
    border: 1px solid var(--cyan);
    border-radius: 50%;
    color: var(--cyan);
    line-height: 26px;
    text-align: center;
    margin-right: 8px;
}
</style>
</head>
<body>
<div class="deck-viewport">
<main class="deck-stage" id="deckStage">
<section class="slide active visible title-slide">
    <div class="crop tl"></div>
    <div class="crop tr"></div>
    <div class="crop bl"></div>
    <div class="crop br"></div>

    <svg class="network-bg" viewBox="0 0 900 1080" xmlns="http://www.w3.org/2000/svg">
        <g stroke="#5ec8d8" stroke-width="1" fill="none">
            <line x1="120" y1="180" x2="340" y2="260"/>
            <line x1="340" y1="260" x2="560" y2="140"/>
            <line x1="340" y1="260" x2="420" y2="470"/>
            <line x1="420" y1="470" x2="660" y2="420"/>
            <line x1="420" y1="470" x2="300" y2="650"/>
            <line x1="660" y1="420" x2="780" y2="600"/>
            <line x1="300" y1="650" x2="480" y2="820"/>
            <line x1="480" y1="820" x2="700" y2="900"/>
            <line x1="560" y1="140" x2="760" y2="240"/>
        </g>
        <g fill="#5ec8d8">
            <circle cx="120" cy="180" r="5"/>
            <circle cx="340" cy="260" r="6"/>
            <circle cx="560" cy="140" r="5"/>
            <circle cx="420" cy="470" r="7"/>
            <circle cx="660" cy="420" r="5"/>
            <circle cx="300" cy="650" r="5"/>
            <circle cx="780" cy="600" r="5"/>
            <circle cx="480" cy="820" r="6"/>
            <circle cx="700" cy="900" r="5"/>
            <circle cx="760" cy="240" r="4"/>
        </g>
        <g fill="#ffb703">
            <circle cx="420" cy="470" r="3"/>
        </g>
    </svg>

    <div class="figtag reveal"><span class="num">01</span>PROPERTY INTELLIGENCE — 2026</div>

    <div class="eyebrow reveal">Field Guide</div>
    <h1 class="headline reveal">How <em>AI</em> Will Shape Real Estate Marketing in 2026</h1>
    <div class="dimension-line reveal">
        <div class="tick"></div>
        <div class="bar"></div>
        <div class="label">SCALE 1:1 — WHAT AGENTS NEED TO KNOW</div>
        <div class="bar"></div>
        <div class="tick"></div>
    </div>
    <p class="subtitle reveal">A blueprint for agents, brokerages, and marketing teams building for what's next.</p>
</section>
</main>
</div>
<script>
function setupStageScale() {
    const stage = document.getElementById('deckStage');
    const scale = () => {
        const factor = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        const x = (window.innerWidth - 1920 * factor) / 2;
        const y = (window.innerHeight - 1080 * factor) / 2;
        stage.style.transform = `translate(${x}px, ${y}px) scale(${factor})`;
    };
    scale();
    window.addEventListener('resize', scale);
}
setupStageScale();
</script>
</body>
</html>
